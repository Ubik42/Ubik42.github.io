<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Lucas Shen — AI Tool Technical Artist</title>
  <desc id="desc">A project-native portfolio title showing how production problems become rules, bounded AI assistance, tools, and reviewable evidence.</desc>

  <defs>
    <linearGradient id="plum-depth" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#74105b"/>
      <stop offset="1" stop-color="#3b082f"/>
    </linearGradient>
    <pattern id="fine-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.07"/>
    </pattern>
  </defs>

  <rect width="1200" height="420" rx="26" fill="#0f0c11"/>
  <path d="M0 26Q0 0 26 0H732V420H26Q0 420 0 394Z" fill="url(#plum-depth)"/>
  <path d="M732 0H1174Q1200 0 1200 26V394Q1200 420 1174 420H732Z" fill="#f6f4f5"/>
  <rect x="24" y="24" width="684" height="372" rx="16" fill="url(#fine-grid)" stroke="#ffffff" stroke-opacity="0.18"/>

  <g transform="translate(64 58)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif">
    <text fill="#ffffff" opacity="0.82" font-size="18" font-weight="700" letter-spacing="2.2">AI / DCC / ENGINE / EVIDENCE</text>
    <text y="104" fill="#ffffff" font-size="72" font-weight="800" letter-spacing="-3">Lucas Shen</text>
    <text y="158" fill="#ffffff" font-size="38" font-weight="750">沈裕焱</text>
    <text y="207" fill="#20ec8d" font-size="30" font-weight="760">AI Tool Technical Artist</text>
    <rect y="236" width="48" height="4" fill="#20ec8d"/>
    <text y="278" fill="#ffffff" font-size="23" font-weight="520">Inspectable AI-assisted tools for DCC,</text>
    <text y="311" fill="#ffffff" font-size="23" font-weight="520">engine, and art-production workflows.</text>

    <g transform="translate(494 224)">
      <rect width="168" height="112" fill="#20ec8d"/>
      <circle cx="84" cy="48" r="28" fill="#ffffff"/>
      <path d="M58 44c4-26 46-31 53-5-12-10-31-8-39 7-5 10-3 23 5 31-14-3-22-17-19-33Z" fill="#111013"/>
      <circle cx="77" cy="53" r="3" fill="#111013"/>
      <circle cx="96" cy="53" r="3" fill="#111013"/>
      <path d="M78 66c8 6 17 6 24 0" fill="none" stroke="#111013" stroke-width="3" stroke-linecap="round"/>
      <text x="12" y="98" fill="#111013" font-size="16" font-weight="800" letter-spacing="1.2">ID / LSHEN</text>
    </g>
  </g>

  <g transform="translate(778 48)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif">
    <text fill="#171217" font-size="35" font-weight="800" letter-spacing="-1">Rules become tools.</text>
    <text y="45" fill="#171217" font-size="35" font-weight="800" letter-spacing="-1">Evidence closes the loop.</text>
    <text y="86" fill="#6d626a" font-size="17" font-weight="700" letter-spacing="1.8">SIX LAYERS · ONE REVIEWABLE HANDOFF</text>

    <path d="M26 124V344" stroke="#a79ea5" stroke-width="2"/>
    <g font-size="19">
      <g transform="translate(0 124)"><circle cx="26" r="9" fill="#ffffff" stroke="#171217" stroke-width="2"/><text x="56" y="7" fill="#171217" font-weight="750">01  Problem</text><text x="250" y="7" fill="#6d626a">define constraint</text></g>
      <g transform="translate(0 168)"><circle cx="26" r="9" fill="#ffffff" stroke="#171217" stroke-width="2"/><text x="56" y="7" fill="#171217" font-weight="750">02  Rules</text><text x="250" y="7" fill="#6d626a">encode protocol</text></g>
      <g transform="translate(0 212)"><circle cx="26" r="10" fill="#20b96f"/><text x="56" y="7" fill="#15965a" font-weight="800">03  AI assist</text><text x="250" y="7" fill="#6d626a">draft · diagnose</text></g>
      <g transform="translate(0 256)"><circle cx="26" r="9" fill="#ffffff" stroke="#171217" stroke-width="2"/><text x="56" y="7" fill="#171217" font-weight="750">04  Human review</text><text x="250" y="7" fill="#6d626a">approve boundary</text></g>
      <g transform="translate(0 300)"><circle cx="26" r="10" fill="#1657c8"/><text x="56" y="7" fill="#1657c8" font-weight="800">05  DCC / Engine</text><text x="250" y="7" fill="#6d626a">run scene facts</text></g>
      <g transform="translate(0 344)"><circle cx="26" r="9" fill="#ffffff" stroke="#171217" stroke-width="2"/><text x="56" y="7" fill="#171217" font-weight="750">06  Evidence</text><text x="250" y="7" fill="#6d626a">export handoff</text></g>
    </g>
